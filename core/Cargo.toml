[package]
name = "journal-core"
version = "0.1.0"
edition = "2024"
description = "Client-side systemd journal parsing and filtering for journal://analyzer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
lz4_flex = "0.11"
lzma-rs = "0.3"
regex = "1.12"
regress = "0.12"
ruzstd = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Performance", "WorkerGlobalScope"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
